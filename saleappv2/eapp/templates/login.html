{% extends 'layout/base.html' %}
{% block content %}
<h1 class="text-center text-success mt-1">ĐĂNG NHẬP</h1>
<form method="post" action="/login" >
  <div class="form-group">
    <label for="username">Tên đăng nhập</label>
    <input type="text" class="form-control" placeholder="Tên đăng nhập" id="username" name="username" required>
  </div>
  <div class="form-group">
    <label for="pwd">Password:</label>
    <input type="password" class="form-control" placeholder="Enter password" id="pwd" name="password" required>
  </div>
  <button type="submit" class="btn btn-primary">Đăng nhập</button>
</form>
{% endblock %}
